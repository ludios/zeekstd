# Model-output: Claude Opus 5.5

[package]
name = "zeekstd"
# The ludios fork's own version line, apart from upstream's 0.x; `VERSION` says when it changes.
version = "7.0.0"
description.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
zstd-safe = { workspace = true }

[dev-dependencies]
criterion = "0.8.1"
proptest = "1.9.0"
zstd = "0.14.3"

[dev-dependencies.zstd-safe]
workspace = true
features = ["seekable"]

[features]
default = ["std"]

std = ["zstd-safe/std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[[bench]]
name = "compress"
harness = false

[[bench]]
name = "decompress"
harness = false
